name: LaTeX 自动化编译与网页生成

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [ source_book_updated ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出当前 CloudComputingPDF 仓库
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      # 2. 拉取私有源仓库 CCBook 的 LaTeX 源码
      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: 'HNU-CloudComputing/CCBook'
          token: ${{ secrets.NOTIFY_PAT }}
          path: 'CCBook'
          ref: 'main'
          fetch-depth: 0

      # 3. 极速编译：只编译 1 遍完整版 main.tex
      - name: 🚀 统一编译完整版书籍 (生成 main.pdf)
        uses: docker://ghcr.io/xu-cheng/texlive-full:latest
        with:
          args: |
            bash -c '
              cd CCBook
              xelatex -interaction=nonstopmode main.tex
            '

      # 4. 优化完整版 PDF 并生成下载物料
      - name: ⚡ 优化 PDF 与准备下载目录
        run: |
          sudo apt-get update && sudo apt-get install -y ghostscript qpdf
          
          mkdir -p test_output_pdfs
          
          # 1. 优化全书 main.pdf 并生成适合 Web 快速加载的线性化版本
          if [ -f "CCBook/main.pdf" ]; then
            echo "正在压缩全书 PDF..."
            gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -dNOPAUSE -dQUIET -dBATCH -sOutputFile="temp_main.pdf" "CCBook/main.pdf"
            qpdf --linearize "temp_main.pdf" "test_output_pdfs/main.pdf"
            rm -f "temp_main.pdf"
            
            # 2. 提取前几页目录（例如前 6 页）
            qpdf --empty --pages CCBook/main.pdf 1-6 -- test_output_pdfs/export_toc.pdf || true
          fi

      # 5. 安装 Quarto
      - name: 📊 安装 Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 6. 渲染 Quarto 网页并将生成的 PDF 整合进 _site
      - name: 🌐 渲染 Quarto 网页
        run: |
          quarto render --output-dir _site
          mkdir -p _site/download_pdfs
          cp test_output_pdfs/*.pdf _site/download_pdfs/ 2>/dev/null || true
          ls -la _site

      # 7. 🚀 发布至 gh-pages 分支
      - name: 🚀 发布至 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true