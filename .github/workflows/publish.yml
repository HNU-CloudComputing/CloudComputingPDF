name: PDF 站点快速发布

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudcomputingpdf-pages-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: 'HNU-CloudComputing/CCBook'
          token: ${{ secrets.NOTIFY_PAT }}
          path: 'CCBook'
          ref: 'main'
          fetch-depth: 0

      - name: 🐍 生成站点首页
        run: python3 scripts/generate_site.py --site-only

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: 🌐 渲染 Quarto 网页
        run: quarto render --output-dir _site

      - name: 📥 读取上一版 PDF
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous_site

      - name: ♻️ 复用已发布 PDF
        run: |
          mkdir -p _site/chapters
          cp -a previous_site/chapters/. _site/chapters/

      - name: 🚀 发布至 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
