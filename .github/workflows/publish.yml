name: LaTeX 自动化编译与网页生成

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [ source_book_updated ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出当前仓库
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      # 2. 拉取私有源仓库 CCBook 的 LaTeX 源码
      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: 'HNU-CloudComputing/CCBook'
          token: ${{ secrets.NOTIFY_PAT }}
          path: 'CCBook'
          ref: 'main'
          fetch-depth: 0

      # 3. 生成独立的纯文本编译脚本 (彻底避免 Docker args 传参转义截断)
      - name: 📝 准备编译脚本
        run: |
          cat << 'EOF' > run_latex.sh
          #!/bin/bash
          set -e
          cd CCBook
          xelatex -interaction=nonstopmode main.tex || true
          EOF
          chmod +x run_latex.sh

      # 4. 在 Docker 容器中执行该脚本
      - name: 🚀 执行 LaTeX 编译 (生成 main.pdf)
        uses: docker://ghcr.io/xu-cheng/texlive-full:latest
        with:
          args: ./run_latex.sh

      # 5. 安装工具、优化 PDF 并切出目录
      - name: ⚡ 优化 PDF 与提取目录
        run: |
          sudo apt-get update && sudo apt-get install -y ghostscript qpdf
          
          mkdir -p test_output_pdfs
          
          if [ -f "CCBook/main.pdf" ]; then
            echo "正在优化主 PDF..."
            gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -dNOPAUSE -dQUIET -dBATCH -sOutputFile="temp_main.pdf" "CCBook/main.pdf"
            qpdf --linearize "temp_main.pdf" "test_output_pdfs/main.pdf"
            rm -f "temp_main.pdf"
            
            # 提取前 6 页目录
            qpdf --empty --pages CCBook/main.pdf 1-6 -- test_output_pdfs/export_toc.pdf || true
          fi

      # 6. 安装 Quarto
      - name: 📊 安装 Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 7. 渲染网页并将生成的 PDF 整合进 _site
      - name: 🌐 渲染 Quarto 网页
        run: |
          quarto render --output-dir _site
          mkdir -p _site/download_pdfs
          cp test_output_pdfs/*.pdf _site/download_pdfs/ 2>/dev/null || true
          ls -la _site

      # 8. 发布到 gh-pages
      - name: 🚀 发布至 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true