name: PDF 并行编译与发布

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ source_book_updated ]

permissions:
  contents: write

concurrency:
  group: cloudcomputingpdf-pdf-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chapters: ${{ steps.matrix.outputs.chapters }}
    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: HNU-CloudComputing/CCBook
          token: ${{ secrets.NOTIFY_PAT }}
          path: CCBook
          ref: main

      - name: 🧩 生成章节并行矩阵
        id: matrix
        run: echo "chapters=$(python3 scripts/generate_site.py --matrix-only)" >> "$GITHUB_OUTPUT"

  build-full:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: HNU-CloudComputing/CCBook
          token: ${{ secrets.NOTIFY_PAT }}
          path: CCBook
          ref: main

      - name: 📘 编译完整教材
        uses: docker://ghcr.io/xu-cheng/texlive-full:latest
        with:
          args: ./scripts/compile_full.sh

      - name: 📦 保存完整教材
        uses: actions/upload-artifact@v4
        with:
          name: pdf-full
          path: CCBook/main.pdf
          if-no-files-found: error
          retention-days: 3

  build-chapters:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chapter: ${{ fromJSON(needs.prepare.outputs.chapters) }}
    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: HNU-CloudComputing/CCBook
          token: ${{ secrets.NOTIFY_PAT }}
          path: CCBook
          ref: main

      - name: 📄 编译 ${{ matrix.chapter.key }}
        uses: docker://ghcr.io/xu-cheng/texlive-full:latest
        env:
          CHAPTER_KEY: ${{ matrix.chapter.key }}
          CHAPTER_REL_PATH: ${{ matrix.chapter.rel_path }}
        with:
          args: ./scripts/compile_chapter.sh

      - name: 📦 保存 ${{ matrix.chapter.key }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-chapter-${{ matrix.chapter.key }}
          path: CCBook/gen_${{ matrix.chapter.key }}.pdf
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build-full, build-chapters]
    runs-on: ubuntu-latest
    concurrency:
      group: cloudcomputingpdf-pages-deploy
      cancel-in-progress: false
    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 📥 拉取私有源仓库 CCBook 源码
        uses: actions/checkout@v4
        with:
          repository: HNU-CloudComputing/CCBook
          token: ${{ secrets.NOTIFY_PAT }}
          path: CCBook
          ref: main

      - name: 🐍 生成站点首页
        run: python3 scripts/generate_site.py --site-only

      - name: 📥 汇总并行编译产物
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: compiled_pdfs
          merge-multiple: true

      - name: ⚙️ 安装 PDF 优化工具
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: 🌐 渲染 Quarto 网页
        run: quarto render --output-dir _site

      - name: ⚡ 压缩与分发 PDF
        run: |
          set -euo pipefail
          mkdir -p _site/chapters

          optimize() {
            local input="$1"
            local output="$2"
            local temporary
            temporary="$(mktemp --suffix=.pdf)"
            gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -dNOPAUSE -dQUIET -dBATCH -sOutputFile="$temporary" "$input"
            qpdf --linearize "$temporary" "$output"
            rm -f "$temporary"
          }

          optimize "compiled_pdfs/main.pdf" "_site/chapters/云计算原理与实践：以在线游戏为载体_全书.pdf"

          for pdf in compiled_pdfs/gen_*.pdf; do
            optimize "$pdf" "_site/chapters/chapter_${pdf#compiled_pdfs/gen_}"
          done

      - name: 🚀 发布至 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
